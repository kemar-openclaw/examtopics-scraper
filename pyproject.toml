[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "examtopics-scraper"
version = "0.1.0"
description = "Resilient scraper for Exam Topics certification exams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Marc Chen" }]
keywords = ["examtopics", "certification", "gcp", "google-cloud", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "playwright>=1.40",
    "rich>=13.0",
    "tenacity>=8.0",
    "fake-useragent>=1.4",
    "aiofiles>=23.0",
]

[project.scripts]
examtopics = "examtopics_scraper.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["A003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["examtopics_scraper"]

[tool.hatch.version]
paths = ["examtopics_scraper/__init__.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
